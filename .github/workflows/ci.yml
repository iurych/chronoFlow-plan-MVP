name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chrono
          POSTGRES_PASSWORD: chrono
          POSTGRES_DB: chronoflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chrono -d chronoflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://chrono:chrono@localhost:5432/chronoflow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      APP_TIMEZONE: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install

      - run: bun run build

      - run: bun run lint

      - run: bun run db:migrate

      - run: bun test --pass-with-no-tests
